# =============================================================================
# Jxf-AI · Phase 0 单机容器编排
#
# 使用方式（仓库根目录）：
#   cp .env.example .env        # 然后修改所有 CHANGE_ME 值
#   docker compose -f docker/docker-compose.yml --env-file .env up -d --build
#
# 依赖关系（严格）：
#   web    → postgres(healthy) + migrate(completed) + minio(healthy) + minio-init(completed)
#   caddy  → web(healthy)
#   migrate→ postgres(healthy)
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-jxf-ai}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector + pg_bigm（自建镜像，构建上下文为仓库根目录）
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    image: jxf-ai/postgres:16-p0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 不能为空}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 不能为空}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 不能为空}
      JXF_OWNER_USER: ${JXF_OWNER_USER:?JXF_OWNER_USER 不能为空}
      JXF_OWNER_PASSWORD: ${JXF_OWNER_PASSWORD:?JXF_OWNER_PASSWORD 不能为空}
      JXF_APP_USER: ${JXF_APP_USER:?JXF_APP_USER 不能为空}
      JXF_APP_PASSWORD: ${JXF_APP_PASSWORD:?JXF_APP_PASSWORD 不能为空}
      JXF_WORKER_USER: ${JXF_WORKER_USER:-app_worker}
      JXF_WORKER_PASSWORD: ${JXF_WORKER_PASSWORD:-}
    command:
      - postgres
      - -c
      - logging_collector=off
      - -c
      - log_destination=stderr
      - -c
      - log_line_prefix=%m [%p] %q%u@%d/%a
      - -c
      - log_min_duration_statement=500
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 仅本机可连，供运维/psql 排障；业务流量走容器网络
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "/usr/local/bin/pg-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 一次性迁移：drizzle migrate + policies/*.sql（幂等，退出码即结果）
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrate
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: jxf-ai/migrate:0.1.0
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql://${JXF_OWNER_USER}:${JXF_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATIONS_DIR: /app/db/migrations
      POLICIES_DIR: /app/db/policies
      JXF_LOG_LEVEL: ${JXF_LOG_LEVEL:-info}
      JXF_VERSION: ${JXF_VERSION:-0.1.0}
      JXF_GIT_SHA: ${JXF_GIT_SHA:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # MinIO：知识库原件 / 导出包
  # ---------------------------------------------------------------------------
  minio:
    # 官方 minio/minio 已从 Docker Hub 下架、quay.io 转为私有；
    # 使用 Bitnami 归档镜像（同版本 MinIO 服务端，自带 mc / curl）
    image: bitnamilegacy/minio:2024.12.18
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 不能为空}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 不能为空}
      MINIO_REGION: ${S3_REGION:-us-east-1}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:?MINIO_BUCKET 不能为空}
    volumes:
      - miniodata:/bitnami/minio/data
    ports:
      # 控制台与 API 仅绑定回环地址，不对公网暴露
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 初始化桶（幂等：--ignore-existing）
  # ---------------------------------------------------------------------------
  minio-init:
    image: bitnamilegacy/minio:2024.12.18
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 不能为空}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 不能为空}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET 不能为空}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        echo "bucket ready: $$MINIO_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Web（Next.js standalone）：唯一对外业务入口，经 caddy 反代
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: jxf-ai/web:0.1.0
    restart: unless-stopped
    init: true
    environment: &app-env
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      JXF_ENV: ${JXF_ENV:-production}
      JXF_LOG_LEVEL: ${JXF_LOG_LEVEL:-info}
      JXF_VERSION: ${JXF_VERSION:-0.1.0-p0}
      JXF_SITE_NAME: ${JXF_SITE_NAME:-Jxf-AI}
      JXF_TENANT_ID: ${JXF_TENANT_ID:?JXF_TENANT_ID 不能为空}
      # fail-closed：缺失 / 过短 / 弱值将拒绝启动
      JXF_AUTH_SECRET: ${JXF_AUTH_SECRET:?JXF_AUTH_SECRET 不能为空}
      # 运行时只能使用受限业务角色 jxf_app（禁止 owner / superuser）
      APP_DATABASE_URL: postgresql://${JXF_APP_USER}:${JXF_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Auth.js 专用角色：容器内固定走服务名 postgres；密码缺失时拒绝启动
      AUTH_DATABASE_URL: postgresql://${JXF_AUTH_USER:-jxf_auth}:${JXF_AUTH_PASSWORD:?JXF_AUTH_PASSWORD 必须配置}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET 不能为空}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 不能为空}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 不能为空}
      # AI：OpenAI 标准兼容；留空即自动降级为 pg_bigm 纯关键词检索
      JXF_AI_ENABLED: ${JXF_AI_ENABLED:-false}
      JXF_AI_BASE_URL: ${JXF_AI_BASE_URL:-https://api.openai.com/v1}
      JXF_AI_API_KEY: ${JXF_AI_API_KEY:-}
      # 深度推理模型（顾问问答 / 复杂检索生成）
      JXF_AI_MODEL_PRO: ${JXF_AI_MODEL_PRO:-deepseek-v4-pro}
      # 高频轻量模型（文档巡读、抽取、蒸馏建卡、摘要）
      JXF_AI_MODEL_FLASH: ${JXF_AI_MODEL_FLASH:-deepseek-flash}
      JXF_AI_TIMEOUT_MS: ${JXF_AI_TIMEOUT_MS:-60000}
      # 容灾：瞬时故障重试 + 备用节点接续
      JXF_AI_RETRY_ATTEMPTS: ${JXF_AI_RETRY_ATTEMPTS:-2}
      JXF_AI_RETRY_BASE_MS: ${JXF_AI_RETRY_BASE_MS:-500}
      JXF_AI_FALLBACK_BASE_URL: ${JXF_AI_FALLBACK_BASE_URL:-}
      JXF_AI_FALLBACK_API_KEY: ${JXF_AI_FALLBACK_API_KEY:-}
      JXF_AI_FALLBACK_MODEL_PRO: ${JXF_AI_FALLBACK_MODEL_PRO:-}
      JXF_AI_FALLBACK_MODEL_FLASH: ${JXF_AI_FALLBACK_MODEL_FLASH:-}
      JXF_AI_TOP_K: ${JXF_AI_TOP_K:-6}
      JXF_AI_MAX_TOKENS: ${JXF_AI_MAX_TOKENS:-2048}
      JXF_EMBEDDING_BASE_URL: ${JXF_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      JXF_EMBEDDING_API_KEY: ${JXF_EMBEDDING_API_KEY:-}
      JXF_EMBEDDING_MODEL: ${JXF_EMBEDDING_MODEL:-text-embedding-3-small}
      JXF_EMBEDDING_DIM: ${JXF_EMBEDDING_DIM:-1024}
      # 扫描件 OCR（Gemini 视觉）：默认关闭，避免私有化部署悄悄外发文档
      JXF_OCR_ENABLED: ${JXF_OCR_ENABLED:-false}
      JXF_OCR_BASE_URL: ${JXF_OCR_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      JXF_OCR_API_KEY: ${JXF_OCR_API_KEY:-}
      JXF_OCR_MODEL: ${JXF_OCR_MODEL:-gemini-3.1-flash-lite}
      JXF_OCR_TIMEOUT_MS: ${JXF_OCR_TIMEOUT_MS:-90000}
      JXF_OCR_MAX_BYTES: ${JXF_OCR_MAX_BYTES:-15000000}
      # MCP 外部连接器：内网主机白名单（逗号分隔主机名/IP）；为空时只允许公网地址
      MCP_TRUSTED_HOSTS: ${MCP_TRUSTED_HOSTS:-}
      # stdio 连接器允许的可执行文件（逗号分隔，建议绝对路径）；为空表示禁用 stdio
      MCP_STDIO_ALLOWED_COMMANDS: ${MCP_STDIO_ALLOWED_COMMANDS:-}
      # 通知邮件：设置面优先，环境变量兜底（留空即不发送）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-}
      # 指标端点保护（可选）：非空时 /api/metrics 要求 Bearer 令牌
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    volumes:
      # 知识库原件落盘目录：必须独立于容器可写层，否则重建容器即丢文件
      - uploads:/app/public/uploads
      # 只读查看宿主机备份产物（M5 脚本写入 backups/），供设置面展示
      - ${JXF_BACKUP_DIR:-../backups}:/app/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # M3 Worker：运行时队列消费者（与 web 同源码，专用 app_worker 受限角色）
  # 长任务只在这里执行；web 只受理并返回 run_id。
  # ---------------------------------------------------------------------------
  worker-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: jxf-ai/worker:0.1.0
    restart: unless-stopped
    init: true
    environment:
      <<: *app-env
      # 队列操作只允许使用 worker 角色；业务表权限一概没有
      WORKER_DATABASE_URL: postgresql://${JXF_WORKER_USER:-app_worker}:${JXF_WORKER_PASSWORD:-}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Caddy：反向代理 + TLS + JSON 访问日志
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      JXF_SITE_ADDRESS: "${JXF_SITE_ADDRESS:-:80}"
      # Caddyfile 中 localhost → 127.0.0.1 的跳转需要带上宿主机端口
      JXF_HOST_PORT: "${JXF_HTTP_PORT:-3000}"
    ports:
      # 默认只开放本机 3000：宿主机 3000 → Caddy 80 → web:3000
      - "127.0.0.1:${JXF_HTTP_PORT:-3000}:80"
      # 默认不开放 443；启用 TLS（JXF_SITE_ADDRESS 设为域名）时再放开
      # - "${JXF_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge
    logging: *default-logging

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  # 知识库原件（public/uploads）：备份时必须与 pgdata 一起覆盖
  uploads:
  caddy_data:
  caddy_config:
